[program:markdown-viewer]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash system/scripts/run_markdown_viewer.sh
directory=/home/user/workspace
autostart=true
autorestart=true
startsecs=30
startretries=5
stdout_logfile=/var/log/supervisor/markdown-viewer-stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/markdown-viewer-stderr.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
