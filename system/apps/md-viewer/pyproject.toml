[project]
name = "md-viewer"
version = "0.1.0"
description = "Search and view markdown files as HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "markdown>=3.4",
    "pymdown-extensions>=10.0",
]

[project.scripts]
md-viewer = "md_viewer.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_viewer"]
